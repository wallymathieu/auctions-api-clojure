services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: auctions
      POSTGRES_PASSWORD: mypass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auctions"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      JDBC_DATABASE_URL: "jdbc:postgresql://db/auctions?user=postgres&password=mypass"
    ports:
      - "8080:3000"
    volumes:
      - .:/app
      - /app/.cpcache
      - m2:/root/.m2
      - gitlibs:/root/.gitlibs
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  m2:
  gitlibs:
